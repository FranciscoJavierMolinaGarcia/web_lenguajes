<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece – Mugiwara Gaming Hub</title>
    <link rel="stylesheet" href="estilos/estilo.css">
</head>
<body>

    <header id="barra-superior">
        <div class="login-container">
            <button class="btn-login">Iniciar Sesión</button>
        </div>
        <div class="logo-titulo">
            <div class="logo-placeholder">
                <img src="Imagenes/OnePieceLogo.png" class="logo-img" alt="One Piece Logo">
            </div>
            <h1>One Piece Wiki</h1>
        </div>
        <div class="dropdown">
            <button class="dropbtn" onclick="toggleDropdown()">Sagas ▼</button> 
            <div class="dropdown-content">
                <a href="#arco-eastblue">East Blue</a>
                <a href="#arco-alabasta">Arabasta</a>
                <a href="#arco-skypiea">Skypiea</a>
                <a href="#arco-water7">Water 7</a>
                <a href="#arco-enieslobby">Enies Lobby</a>
                <a href="#arco-wano">Thriller Bark</a>
                <a href="#arco-marineford">Marineford</a>
                <a href="#arco-wano">Isla Gyojin</a>
                <a href="#arco-dressrosa">Dressrosa</a>
                <a href="#arco-wci">Whole Cake Island</a>
                <a href="#arco-wano">Wano</a>
                <a href="#arco-wano">TO BE CONTINUED</a>
            </div>
        </div>
    </header>

 
    <div class="aviso-sticky"></div>
    <main id="contenedor-principal">

        <section id="personajes" class="seccion-grid">
            <h2>MUHIWARAS</h2>
            <div class="grid-personajes">
                <div class="personaje-card">
                    <img src="Imagenes/Luffy.jpeg" alt="Luffy" loading="lazy">
                    <p>Monkey D. Luffy</p>
                </div>
                <div class="personaje-card">
                    <img src="Imagenes/Zoro.jpeg" alt="Zoro" loading="lazy">
                    <p>Roronoa Zoro</p>
                </div>
                <div class="personaje-card">
                    <img src="Imagenes/Nami.jpeg" alt="Nami" loading="lazy">
                    <p>Nami</p>
                </div>
                <div class="personaje-card">
                    <img src="Imagenes/Usoop.jpeg" alt="Usopp" loading="lazy">
                    <p>Usopp</p>
                </div>
                <div class="personaje-card">
                    <img src="Imagenes/Sanji.jpeg" alt="Sanji" loading="lazy">
                    <p>Sanji</p>
                </div>
                <div class="personaje-card">
                    <img src="Imagenes/Chooper.jpeg" alt="Chopper" loading="lazy">
                    <p>Tony Tony Chopper</p>
                </div>
                <div class="personaje-card">
                    <img src="Imagenes/Robin.jpeg" alt="Robin" loading="lazy">
                    <p>Nico Robin</p>
                </div>
                <div class="personaje-card">
                    <img src="Imagenes/Franky.jpeg" alt="Franky" loading="lazy">
                    <p>Franky</p>
                </div>
                <div class="personaje-card">
                    <img src="Imagenes/Brook.jpeg" alt="Brook" loading="lazy">
                    <p>Brook</p>
                </div>
            </div>
        </section>
        
        
    </main>

    <footer class="footer-fijo"> </footer>

    <script>
        function toggleDropdown() {
            document.querySelector('.dropdown-content').classList.toggle('show');
        }
    </script>
</body>
</html>
